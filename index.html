<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UV Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="scene" id="scene" tabindex="0" aria-label="An open book under a blacklight. Click the right page to turn it, the left page to turn it back.">
    <p class="fallback" id="fallback" hidden>This page needs WebGL to draw the book. Try a current version of Chrome, Safari, Firefox or Edge.</p>
  </main>
  <div class="lamps" id="lamps" role="radiogroup" aria-label="Lamp colour"></div>

  <!-- The pages are written in content/book.md and drawn onto the 3D book.
       main.js also copies them here as plain text for screen readers. -->
  <div class="sr-only" id="pages"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
